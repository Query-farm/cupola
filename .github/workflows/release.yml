name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  IMAGE_NAME: ghcr.io/query-farm/cupola
  VGI_SERVICE_URL: https://vgi-open-meteo.rusty-bb6.workers.dev

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cupola
    steps:
      - name: Checkout Cupola
        uses: actions/checkout@v4
        with:
          path: cupola

      - name: Checkout vgi-rpc-typescript
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-typescript
          path: vgi-rpc-typescript

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}." >&2
            exit 1
          }

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --cwd ../vgi-rpc-typescript
          bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Bundle-size budget
        run: bun run check:bundle

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser smoke and accessibility tests
        run: bun run test:e2e:smoke

  container:
    name: Publish container image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    defaults:
      run:
        working-directory: cupola
    steps:
      - name: Checkout Cupola
        uses: actions/checkout@v4
        with:
          path: cupola

      - name: Checkout vgi-rpc-typescript
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-typescript
          path: vgi-rpc-typescript

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --cwd ../vgi-rpc-typescript
          bun install --frozen-lockfile

      - name: Build flat static bundle
        env:
          BASE_PATH: /
        run: |
          bun run build
          bun run check:bundle
          ./scripts/stage-haybarn-assets.sh

      - name: Build smoke-test image
        run: docker build --tag cupola:release-smoke .

      - name: Smoke-test container
        run: ./scripts/test-container.sh cupola:release-smoke

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Cupola
            org.opencontainers.image.description=Self-hosted VGI catalog and query interface

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: cupola
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest container provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  cloudflare:
    name: Deploy Cloudflare
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cupola
    steps:
      - name: Checkout Cupola
        uses: actions/checkout@v4
        with:
          path: cupola

      - name: Checkout vgi-rpc-typescript
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-typescript
          path: vgi-rpc-typescript

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --cwd ../vgi-rpc-typescript
          bun install --frozen-lockfile

      - name: Deploy versioned site and Worker
        env:
          SKIP_CHECKS: "1"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bb68a133a66d26a310231495b13479a1
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: ./publish.sh --skip-commit

  github-release:
    name: Create GitHub Release
    needs: [container, cloudflare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=("${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Cupola ${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
